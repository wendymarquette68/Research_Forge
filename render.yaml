# Render blueprint for ResearchForge AI.
# Dashboard alternative: New + Web Service, connect
# wendymarquette68/Research_Forge (main), then use the build/start commands
# below and set MODEL_API_KEY in Environment. See README "Deploy on Render".
services:
  - type: web
    name: researchforge-ai
    env: node
    branch: main
    # Build tools (Vite/TypeScript) are needed even with NODE_ENV=production.
    buildCommand: npm --prefix server install --include=dev && npm --prefix client install --include=dev && npm run build
    startCommand: npm --prefix server run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Set the real value in the Render dashboard only. Never commit it.
      - key: MODEL_API_KEY
        sync: false
